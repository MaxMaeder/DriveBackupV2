drivebackup-docs-command: |-
  <header>
  ヘルプが必要ですか？以下のリソースを確認してください。
  Wiki: <gold><click:open_url:https://bit.ly/3dDdmwK>https://bit.ly/3dDdmwK</click></gold>
  Discord: <gold><click:open_url:https://bit.ly/3f4VuuT>https://bit.ly/3f4VuuT</click></gold>
drivebackup-help-command: |-
  <header>
  <gold><click:run_command:/drivebackup>/drivebackup</click></gold> - このメニューを表示
  <gold><click:run_command:/drivebackup help>/drivebackup help</click></gold> - ヘルプリソースを表示
  <gold><click:run_command:/drivebackup commands>/drivebackup commands</click></gold> - コマンドヘルプを表示
  <gold><click:run_command:/drivebackup v>/drivebackup [v|version]</click></gold> - プラグインのバージョンを表示
  <gold><click:run_command:/drivebackup linkaccount googledrive>/drivebackup [link|linkaccount] googledrive</click></gold> - Google ドライブと連携
  <gold><click:run_command:/drivebackup linkaccount onedrive>/drivebackup [link|linkaccount] onedrive</click></gold> - OneDrive と連携
  <gold><click:run_command:/drivebackup linkaccount dropbox>/drivebackup [link|linkaccount] dropbox</click></gold> - Dropbox と連携
  <gold><click:run_command:/drivebackup linkaccount googledrive>/drivebackup [unlink|unlinkaccount] googledrive</click></gold> - Google ドライブの連携解除と無効化
  <gold><click:run_command:/drivebackup linkaccount onedrive>/drivebackup [unlink|unlinkaccount] onedrive</click></gold> - OneDrive の連携解除と無効化
  <gold><click:run_command:/drivebackup linkaccount dropbox>/drivebackup [unlink|unlinkaccount] dropbox</click></gold> - Dropbox の連携解除と無効化
  <gold><click:run_command:/drivebackup reloadconfig>/drivebackup reloadconfig</click></gold> - config.yml を再読み込み
  <gold><click:run_command:/drivebackup debug>/drivebackup debug</click></gold> - トラブルシューティング情報を収集
  <gold><click:run_command:/drivebackup nextbackup>/drivebackup nextbackup</click></gold> - 次回の自動バックアップ日時を確認
  <gold><click:run_command:/drivebackup status>/drivebackup status</click></gold> - 実行中のバックアップステータスを確認
  <gold><click:run_command:/drivebackup backup>/drivebackup backup</click></gold> - 手動バックアップを開始
  <gold><click:run_command:/drivebackup test ftp>/drivebackup test ftp</click></gold> - (S)FTP サーバーへの接続テスト
  <gold><click:run_command:/drivebackup test googledrive>/drivebackup test googledrive</click></gold> - Google ドライブへの接続テスト
  <gold><click:run_command:/drivebackup test onedrive>/drivebackup test onedrive</click></gold> - OneDrive への接続テスト
  <gold><click:run_command:/drivebackup test dropbox>/drivebackup test dropbox</click></gold> - Dropbox への接続テスト
  <gold><click:run_command:/drivebackup update>/drivebackup update</click></gold> - プラグインを最新版に更新
